  status: verified
  source: The owner (2026-11-13), with the photograph; the words drafted by us
  order: 8
- id: m2025
  year: 2025
  title: "New divisions"
  body: |-
    Stride Talent officially launches divisions for each kind of content its talent publish: Gaming, AI, Family, Fashion, Technology, Beauty, Outdoors and Lifestyle.
  # One creator from each of these niches that is a division on the roster (the owner, 2026-11-13); AI, Technology and
  # Outdoors have none yet.
  divisions: [gaming, family, fashion, beauty, lifestyle]
  status: verified
  source: Stride's history, from the owner (2026-11-13)
