# Our History milestones: About's story (group/StoryReel.astro) and Our History (group/HistoryRoad.astro).
# Stride's own history, supplied by the owner on 2026-11-13 ("Strides History _ About Stride.pdf", then dated
# moments with their photographs) in place of the previous site's timeline. The facts, figures, dates and photographs
# are the owner's; the wording is edited for spelling and grammar, and the titles and captions are drafted by us, both
# for the owner to read over. On desktop About shows each body in full with its photographs (`images`); phones and
# tablets show its first paragraph. Months live in the words (the year is the chapter's mark); `order` is the timeline.
- id: m2019
  year: 2019
  title: "Alex builds an audience"
  body: |-
    Alex, known as Alxhendy on social media, grew his following to just under 6 million with pranks and comedy sketches made with his sister and friends. He signed with several talent management companies and found they fell short: they could do more for their talent's day-to-day lives, not just chase commercial deals.

    So Alex started helping his creator friends himself, with brand deals and content strategy.
  # Two of Alex's own TikToks, from the owner (2026-11-13): they play muted in their prints while the chapter is on.
  images:
    - src: /assets/history/2019-alxhendy-1.jpg
      video: /assets/video/history-2019-alxhendy-1.mp4
      alt: "A still from @alxhendy's TikTok prank I kissed his GF: two friends playing a lie-detector game in a garden"
      # The figure is the owner's (2026-11-18), in place of "@alxhendy on TikTok".
      caption: "+5.5M followers on TikTok"
    - src: /assets/history/2019-alxhendy-2.jpg
      video: /assets/video/history-2019-alxhendy-2.mp4
      alt: "A still from @alxhendy's TikTok Sour Candy Prank On sister: a tube of super sour sweets held up to the camera"
  # No button previewing his TikTok profile since 2026-11-18 (the owner: "remove the 'see alexhendy on tiktok' button").
  status: verified
  source: Stride's history, from the owner (2026-11-13); the videos are Alex's own TikToks; his TikTok following (+5.5M) from the owner (2026-11-18)
  order: 1
- id: m2021
  year: 2021
  title: "The first logo and the start of Stride Social"
  body: |-
    Alex took the idea of an influencer agency to Ollie, who was starting CMA Media, a paid ads agency, at the time. Together they decided to build it, with one mission: to simplify how brands work with influencers.
  images:
    - src: /assets/history/2021-first-logo-1.jpg
      alt: "Stride Social's first logo, two pairs of black triangles beside the words Stride Social, on a screen, with a member of the Stride team beside it"
      caption: "Stride Social's first logo"
    - src: /assets/history/2021-first-logo-2.jpg
      alt: "Stride Social's first logo on a screen, with another member of the Stride team beside it"
  status: verified
  source: Stride's history and photographs, from the owner (2026-11-13)
  order: 2
- id: m2021-ims
  year: 2021
  title: "Our first influencer show"
  body: |-
    Alex and Ollie at Stride's first influencer show in London: the Influencer Marketing Show.
  images:
    - src: /assets/history/2021-influencer-marketing-show.jpg
      alt: "Alex Hendy and Ollie Kitson holding up their Influencer Marketing Show badges, which name them for Stride Social Ltd"
      caption: "The Influencer Marketing Show, London"
    - src: /assets/history/2021-influencer-marketing-show-card.jpg
      alt: "The Influencer Marketing Show Europe's title card, dated 26 October 2023"
  status: verified
  source: The owner (2026-11-13), with the photograph and the show's title card
  order: 3
- id: m2022
  year: 2022
  title: "Stride Talent opens"
  body: |-
    Stride Social opens its influencer management arm, Stride Talent, with one goal: to make being a creator a better experience, down to getting talent into real-life events like film premieres and brand events.
  # Some of Stride Talent's creators (the owner, 2026-11-13): the first three its page features, by the roster's rules.
  creators: 3
  status: verified
  source: Stride's history, from the owner (2026-11-13)
  order: 4
- id: m2024-ims
  year: 2024
  title: "The Influencer Marketing Show"
  body: |-
    Stride Social, the advertising arm, has a clear vision: to connect influencers with fast-growing e-commerce and Amazon brands. In January 2024, sponsoring the Influencer Marketing Show in London marked a turning point. Standing beside such a high-profile event cemented Stride Social's reputation as a leader in influencer marketing: more than a sponsorship, it was a statement of intent to drive the industry forward.

    Stride also won an award from Hello Partners, which listed it among the world's top 30 influencer marketing companies to work with.
  # The owner's two pictures (2026-11-13): the stand, then the show's title card (it reads USA, 3-4 June 2024).
  images:
    - src: /assets/history/2024-influencer-marketing-show.jpg
      alt: "Three members of the Stride team at Stride Social's stand at the Influencer Marketing Show, a Stride Social sign above them and a floor sign in front reading 'Ready to succeed with Influencers overseas?'"
      caption: "Stride Social's stand at the show"
    - src: /assets/history/2024-influencer-marketing-show-card.jpg
      alt: "The Influencer Marketing Show USA's title card, dated 3 to 4 June 2024"
  status: verified
  source: Stride's history, from the owner (2026-11-13), with the owner's photograph and the show's title card
  order: 5
