# Stride Talent landing copy (docs/phase-2/05-wireframes.md §C). status: approved = from the
# client brief or signed off; draft = written by us, shows a "Draft copy" tag in preview and
# blocks production.
sections:
  hero:
    # Draft since the owner's new line (2026-11-13, said better): "We support our talent through 360 management."
    status: draft
    eyebrow: Stride Talent
    # The division's name, as on Stride Sport and Stride Speakers (the owner's call, 2026-11-09). The brief's
    # headline here was "More than management."
    lines: [Stride, Talent.]
    body: We give our talent 360° management, supporting every side of their career.
    items:
      - label: Explore Our Roster
        href: /talent/roster
      - label: Apply For Management
        href: /talent/apply
    # Roster ids for the portrait wall (proposed; each needs confirmed consent before launch).
    featured: [amandaagy, ambsholly, aqsaxiqbal, camilla-gimenez, carlosdia, hamajineo, itstimiduhh, koliamishka, lancetann, lauraeletel, spencer-sebastian-yang, tiffanydaviesfx, beingamina, thegreyindian]

  # Facts from the client brief (PDF §5): since 2022, over 600 creators. Confirm both (Q1, Q2).
  intro:
    status: draft
    eyebrow: About Stride Talent
    body: "Since 2022, Stride Talent has represented creators across global markets. Today we work with more than 600 of them, and our mission hasn't changed: to make being a creator a better experience."

  services:
    status: draft
    eyebrow: What we do
    headline: Your career. Our commitment.
    # Service names verbatim from the brief; one-line descriptions drafted for approval.
    items:
      - label: Commercial partnership sourcing
        copy: We look for brands that suit your content and your audience, and bring the right ones to you.
      - label: Brand deal negotiations
        copy: We negotiate fees, usage and terms, so every deal is worth doing.
      - label: Campaign coordination
        copy: Briefs, deadlines, approvals and invoices, handled, so you can focus on making the content.
      - label: Legal and contractual support
        copy: We go through contracts with you and make sure the terms protect your work and your time.
      - label: Personal brand development
        copy: We help you sharpen what you stand for and grow it across platforms.
      - label: Long-term career planning
        copy: We plan past the next post, towards where you want to be in a year and beyond.
      - label: New commercial opportunities
        copy: We help you find income beyond sponsored posts as your audience and ambitions grow.
      - label: Industry connections and creator community
        copy: You join a network of creators, brands and industry people who share what works.

  # The career plan board: interface copy written by us.
  builder:
    status: draft
    eyebrow: Build your plan
    body: Switch on what you need, then apply.
    items:
      - key: title
        label: Your plan
      - key: empty
        label: Nothing yet. Switch on what you need.

  roster:
    status: approved
    eyebrow: The roster
    headline: Creator roster.
    cta: { label: See Full Roster, href: /talent/roster }

  rosterPage:
    status: draft
    eyebrow: Stride Talent
    headline: Our roster.
    body: Creators we represent and work with, across lifestyle, tech, beauty, fashion and more.

  divisions:
    status: approved
    eyebrow: Specialist divisions
    headline: Divisions.

  apply:
    status: draft
    eyebrow: Apply for representation
    headline: Join Stride Talent.
    items:
      - key: look
        label: Who we look for
        copy: Creators with a clear voice, an engaged audience and a sense of where they want to go next.
      - key: need
        label: What we need
        copy: Your links, your content category and a few lines about you.
      - key: next
        label: What happens next
        copy: The talent team reads every application. If it's a fit, we'll be in touch to talk it through.
      - key: success
        label: "Thanks, {name}. The talent team will review your application."
      - key: education
        label: Just starting out? Stride Academy helps emerging creators learn the industry.
      - key: error
        label: Your application was not sent. Try again, or email us directly.
      - key: unavailable
        label: Applications are temporarily unavailable here. Email us and we'll pick it up from there.
      - key: consent
        label: We use these details to review your application. See our privacy policy.

  # The desktop page (src/components/talent/): interface copy and headlines written by us, for approval.
  picker:
    status: draft
    eyebrow: Divisions
    headline: Find your people.
    body: Pick a division and the roster follows.
    items:
      - key: page
        label: Own page
      - key: empty
        label: Awaiting roster
      - key: emptyNote
        label: Creators for this division are to be confirmed.

  browser:
    status: draft
    headline: Meet our talent.
    # The six "Meet our talent" opens on, in order (roster ids): the first is the large one. Chosen by the owner, 2026-11-07.
    featured: [jacob-suarez, fatimavsb, ash-british-english, yourlifeiswhatyoumakeit, jayyduran, musaandstellaa]
    # The two the owner swapped out for ash-british-english and yourlifeiswhatyoumakeit (2026-11-07): not in this
    # section at all, so they don't come back further down it.
    leaveOut: [iconicgreen1, lexa-merin]
    items:
      - key: search
        label: Search by name, handle or niche
      - key: all
        label: All
      - key: division
        label: Division
      - key: niche
        label: Niche
      - key: relationship
        label: Relationship
      - key: more
        label: Show more
      - key: none
        label: Nobody here yet. Clear the filters, or tell us who you're looking for.
      - key: clear
        label: Clear filters

  # The page ends on "Join the roster." alone: "Book a creator." and its page are gone (the owner, 2026-11-13).
  close:
    status: draft
    items:
      - key: creators
        label: Join the roster.
        copy: For creators. Tell us where you want to go next.
        cta: Apply For Management
        href: /talent/apply

  enquiry:
    status: draft
    eyebrow: Brand enquiries
    headline: Book a creator.
    body: Tell us who you're looking for, your market and what you want to achieve.
    items:
      - key: success
        label: "Thanks, {name}. The talent team will be in touch."
      - key: error
        label: Your enquiry was not sent. Try again, or email us directly.
      - key: unavailable
        label: The form is temporarily unavailable. Email us and we'll pick it up from there.
      - key: consent
        label: We use these details to reply to your enquiry. See our privacy policy.
