# The niches' stories on /talent (talent/InstaProfile.astro's highlights, its Roster tab and the story player,
# lib/talent-stories.ts): each niche's clips, its top ten and its roster post, and the player's words. It began as
# Stride Talent 2.0's page (/talent-2), deleted on 2026-11-18 (the owner: everything lives on /talent), so some entries
# below (the cards, "Who are you?", "See full roster" on that page) are no longer shown. status: draft = written by us,
# until the owner approves it.
sections:
  hero:
    status: draft
    # Read out by screen readers only: the page shows no headline, as the reference doesn't.
    headline: Stride Talent
    # The story rings, in this order (the owner, 2026-11-16: the rings are niches, the cards each niche's top ten).
    # `key` is the roster category it matches (taxonomies/categories.yaml; "All ... in" opens the roster on it), `label`
    # the name under its ring, `creators` its top ten in order (roster ids): the owner's picks. Until a niche has ten
    # picks, the rest are filled by the roster's rules: its signed and partner creators with the largest audience
    # figures on the roster sheet (unverified figures, used only to choose, never shown). The ring shows its first
    # creator's face. Each story plays the creator's clip (their roster entry's `videos`), or their photo until it has one.
    # `clips` (optional): clips of the niche itself (the owner's own clips; sources in docs/ASSET-SOURCES.md), each under
    # its creator's name, photo and page when `creator` (a roster id) says who made it, else under Stride Talent's (the
    # owner confirmed eight creators, 2026-11-17). A niche with clips plays only its clips, and its cards on /talent-2 are them.
    # The owner, 2026-11-17: every niche plays only clips whose creator is known ("buscar videos para poder descartar
    # los que no tienen nombre"): the owner's eight confirmed clips, then the latest marked ad (Paid partnership / #ad)
    # of creators on Stride's roster sheet, found on their Instagram (docs/ASSET-SOURCES.md has each one's post).
    niches:
      - key: lifestyle
        label: Lifestyle
        creators: []
        # Every niche's stories end on a card that offers its full roster, opened on /talent's profile, its Roster tab
